[package]
name = "omola-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Omola desktop GUI (egui): Dymola-style modeling and simulation workbench backed by OpenModelica"

[[bin]]
name = "omola-gui"
path = "src/main.rs"

[dependencies]
omola-core = { path = "../omola-core" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui = "0.37"
egui_material_icons = "0.9"
egui_extras = { version = "0.37", default-features = false, features = ["file", "image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
