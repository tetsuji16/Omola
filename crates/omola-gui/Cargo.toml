[package]
name = "omola-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Omola desktop GUI (egui): Dymola-style modeling and simulation workbench backed by OpenModelica"

[[bin]]
name = "omola-gui"
path = "src/main.rs"

[dependencies]
omola-core = { path = "../omola-core" }
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11", "persistence"] }
egui = "0.37"
egui_material_icons = "0.9"
egui_extras = { version = "0.37", default-features = false, features = ["file", "image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `xdg-portal` alone is not enough: rfd's own default is `["xdg-portal", "async-std"]`,
# and without `async-std` the `zbus` it pulls in is built with neither `async-io` nor
# `tokio`, which does not compile ("no field `0` on `abstractions::process::Command`").
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
