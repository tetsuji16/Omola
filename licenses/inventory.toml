# External components are separated from Omola code and are not bundled by this repository.
[[external_components]]
name = "OpenModelica Compiler (OMC)"
version = "1.27.1-minimal development image"
source = "https://github.com/OpenModelica/OpenModelica"
license = "OSMC-PL 1.8 or AGPL-3.0 as stated by selected official distribution; third-party components retain their own terms"
distribution = "External process prerequisite; repository does not redistribute the image. Development container only; review selected distribution and linked components before redistribution."

[[external_components]]
name = "Modelica Standard Library (MSL)"
version = "4.1.0 compatibility target; optional"
source = "https://github.com/modelica/ModelicaStandardLibrary"
license = "BSD-3-Clause"
distribution = "Not vendored or installed by Omola; user-installed optional library."

[[external_components]]
name = "Self-authored FixtureLib"
version = "1.0"
source = "tests/project-root/packages/FixtureLib 1.0/package.mo"
license = "MIT (project license)"
distribution = "Small test fixture shipped in repository."

[[external_components]]
name = "Dymola vendor libraries and runtime"
version = "N/A"
source = "Commercial vendor ecosystem; no binaries or libraries included"
license = "Applicable Dymola program terms; review for each version/use"
distribution = "Excluded; no Dymola files/runtime shipped."

[[external_components]]
name = "FMI runtime"
version = "None embedded by Omola"
source = "OMC delegated FMU generation; generated FMU is a separate artifact"
license = "Depends on generated artifact contents and third-party components"
distribution = "No FMI runtime bundled by Omola; audit each generated FMU package before redistribution."

[[external_components]]
name = "Rust toolchain in development container"
version = "rustup stable channel (resolved at image build time)"
source = "https://rustup.rs/"
license = "Apache-2.0 or MIT (Rust project components; see upstream notices)"
distribution = "Development-only; not embedded in Omola binaries. Toolchain is intentionally not pinned to a dated release yet."

[[external_components]]
name = "Debian development utilities in container"
version = "ca-certificates, curl, build-essential, git (distribution versions from base image repositories)"
source = "Debian package repositories configured by the base image"
license = "Per-package upstream licenses and Debian copyright notices"
distribution = "Development-only; not embedded in Omola binaries. Exact transitive OS package versions are supplied by the mutable base-image tag and must be reviewed before republishing the image."

[[workflow_actions]]
reference = "actions/checkout@v4"
source = "https://github.com/actions/checkout"
license = "MIT"
distribution = "GitHub-hosted CI action; not included in Omola binaries. Tag is a mutable upstream reference."

[[workflow_actions]]
reference = "dtolnay/rust-toolchain@stable"
source = "https://github.com/dtolnay/rust-toolchain"
license = "MIT"
distribution = "GitHub-hosted CI action; not included in Omola binaries. Tag is a mutable upstream reference."

[[workflow_actions]]
reference = "actions/upload-artifact@v4"
source = "https://github.com/actions/upload-artifact"
license = "MIT"
distribution = "GitHub-hosted CI action; not included in Omola binaries. Tag is a mutable upstream reference."

[[workflow_actions]]
reference = "OpenModelica/setup-openmodelica@419f31141aa79a22f7033def5626047dd3bb5069"
source = "https://github.com/OpenModelica/setup-openmodelica"
license = "OSMC Public License 1.8 (upstream repository)"
distribution = "GitHub-hosted Windows OMC CI action; not included in Omola binaries. Pinned to an immutable upstream commit."


