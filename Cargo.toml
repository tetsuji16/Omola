[workspace]
members = ["crates/omola-core", "crates/omola-cli", "crates/omola-gui"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

# Dependencies (egui, epaint, syntect, image, ...) are optimized even in dev builds so the
# GUI stays responsive; our own crates keep fast incremental builds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
